[package]
name = "respawn-cli"
description = "Command-line front end for Respawn"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
respawn-core = { version = "0.1.0", path = "../respawn-core" }
clap = { version = "4.6.8", features = ["derive"] }
dialoguer = "0.12.0"
indicatif = "0.18.6"

[[bin]]
name = "respawn"
path = "src/main.rs"
