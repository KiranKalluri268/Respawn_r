name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/respawn.exe respawn.exe
          (Get-FileHash respawn.exe -Algorithm SHA256).Hash.ToLower() + "  respawn.exe" | Out-File -Encoding ascii respawn.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            respawn.exe
            respawn.exe.sha256
          generate_release_notes: true
